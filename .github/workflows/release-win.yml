name: Release Win

# Триггер: push тэга `v*` (например `v1.2.0`). Версия из tag должна
# совпадать с `apps/desktop/package.json` — workflow это проверяет.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # ручной запуск из GitHub UI

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # pnpm 11.1.2 (из packageManager) требует Node 22.13+.
          node-version: '22'
          cache: 'pnpm'

      - name: Install ImageMagick
        run: choco install imagemagick.app -y --no-progress

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Generate icons (.ico / .icns / .png)
        run: pnpm --filter @pyn/desktop build:icons

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $pkg = node -e "console.log(require('./apps/desktop/package.json').version)"
          if ($tag -ne $pkg) {
            Write-Error "Tag '$tag' != package version '$pkg'"
            exit 1
          }
          echo "Building Pyn $pkg"

      - name: Build Win portable
        run: pnpm --filter @pyn/desktop build:win
        env:
          # electron-builder не должен лезть в auto-publish (мы шлём вручную).
          ELECTRON_BUILDER_DISABLE_PUBLISH: 'true'

      - name: Locate artifact
        id: artifact
        shell: pwsh
        run: |
          $version = node -e "console.log(require('./apps/desktop/package.json').version)"
          # electron-builder artifactName в package.json = "Pyn ${version}.exe" (с пробелом).
          $path = "apps/desktop/release/Pyn $version.exe"
          if (-not (Test-Path $path)) {
            Write-Error "Artifact not found: $path"
            Get-ChildItem apps/desktop/release/ | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          echo "path=$path"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          echo "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $hash = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLower()
          echo "sha256=$hash"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          echo "Built: $path  ($hash)"

      - name: Upload artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: pyn-${{ steps.artifact.outputs.version }}-portable
          path: ${{ steps.artifact.outputs.path }}
          retention-days: 30

      - name: Upload EXE to R2 bucket (otl-app-releases)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          # Реальный download flow: client → api.otlhelper.com/desktop/win/latest
          # → CF Worker reads app_version[desktop-win].current_version
          # → fetches R2 key desktop/win/pyn-${version}.exe → returns binary.
          # SCP на VPS local disk (старый workflow) не нужен — download идёт
          # через R2 не через nginx статику.
          npm install -g wrangler@4
          R2_KEY="desktop/win/pyn-${{ steps.artifact.outputs.version }}.exe"
          npx wrangler r2 object put "otl-app-releases/$R2_KEY" \
            --file="${{ steps.artifact.outputs.path }}" \
            --remote
          echo "R2 uploaded: otl-app-releases/$R2_KEY (sha256=${{ steps.artifact.outputs.sha256 }})"

      - name: Upload EXE to VPS (sslip.io /win.exe)
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        shell: bash
        run: |
          # Короткая ссылка для юзеров: https://45-12-239-5.sslip.io/win.exe
          # Файл на диске VPS + имя pyn-<version>.exe в Content-Disposition.
          VERSION="${{ steps.artifact.outputs.version }}"
          ARTIFACT="${{ steps.artifact.outputs.path }}"
          install -m 600 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          VPS="root@45.12.239.5"
          SCP="scp -i ~/.ssh/vps_key -o StrictHostKeyChecking=accept-new"
          SSH="ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=accept-new"
          REMOTE_DIR="/var/www/otl-releases"
          $SCP "$ARTIFACT" "$VPS:$REMOTE_DIR/pyn-$VERSION.exe"
          $SSH "$VPS" "cp -f $REMOTE_DIR/pyn-$VERSION.exe $REMOTE_DIR/pyn-latest.exe && printf '%s\n' \"add_header Content-Disposition 'attachment; filename=\\\"pyn-$VERSION.exe\\\"';\" > $REMOTE_DIR/win-exe-headers.conf && chmod 644 $REMOTE_DIR/pyn-$VERSION.exe $REMOTE_DIR/pyn-latest.exe $REMOTE_DIR/win-exe-headers.conf"
          echo "VPS sslip.io → $REMOTE_DIR/pyn-$VERSION.exe (+ pyn-latest.exe symlink copy)"

      - name: Update D1 app_version[desktop-win]
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          VERSION="${{ steps.artifact.outputs.version }}"
          SHA="${{ steps.artifact.outputs.sha256 }}"
          SQL="UPDATE app_version SET current_version='$VERSION', update_url='https://api.otlhelper.com/desktop/win/latest', binary_sha='$SHA', notes='Pyn $VERSION release via GitHub Actions', updated_by='gh-actions', updated_at=datetime('now') WHERE app_scope='desktop-win'"
          npx wrangler d1 execute otl-db --remote --command="$SQL"
          echo "D1 app_version[desktop-win] → current_version=$VERSION"
          echo ""
          echo "Released:"
          echo "  Version: $VERSION"
          echo "  SHA-256: $SHA"
          echo "  Download URL: https://api.otlhelper.com/desktop/win/latest"
          echo "  VPS bypass:     https://45-12-239-5.sslip.io/win.exe"
          echo "  Clients with current_version < $VERSION will see update pill on next app_status call."
