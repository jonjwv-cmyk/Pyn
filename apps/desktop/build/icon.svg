<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Pyn logo — orange map-pin orbited by an arrow.
    Background: solid black. Foreground: warm orange gradient (brand-clay / kraft).
    Используется как source для .ico (Windows) и .icns (Mac) — CI генерирует
    multi-resolution через `magick convert` (см. scripts/build-icons.mjs).
  -->
  <defs>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F39A6B"/>
      <stop offset="55%" stop-color="#D97757"/>
      <stop offset="100%" stop-color="#A8462E"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A8462E"/>
      <stop offset="60%" stop-color="#D97757"/>
      <stop offset="100%" stop-color="#F39A6B"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="#000000"/>

  <!-- Pin (map marker) -->
  <path
    d="M 512 220
       C 360 220 250 330 250 480
       C 250 600 380 740 512 880
       C 644 740 774 600 774 480
       C 774 330 664 220 512 220 Z"
    fill="url(#pinGrad)"
  />
  <!-- Hole in pin (sphere) -->
  <circle cx="512" cy="450" r="92" fill="#000000"/>

  <!--
    Orbiting arrow — две полуэллипса (передняя + задняя часть орбиты),
    плюс наконечник стрелки справа сверху.
  -->
  <!-- Передняя дуга (foreground) — снизу пина -->
  <path
    d="M 220 720
       Q 512 920 820 700"
    fill="none"
    stroke="url(#arrowGrad)"
    stroke-width="48"
    stroke-linecap="round"
  />
  <!-- Задняя дуга (background, чуть тоньше) — сверху пина -->
  <path
    d="M 220 720
       Q 460 410 820 700"
    fill="none"
    stroke="url(#arrowGrad)"
    stroke-width="36"
    stroke-linecap="round"
    opacity="0.55"
  />
  <!-- Наконечник стрелки -->
  <path
    d="M 820 700
       L 760 640
       L 820 700
       L 760 760 Z
       M 820 700
       L 880 660
       M 820 700
       L 880 740"
    fill="url(#arrowGrad)"
    stroke="url(#arrowGrad)"
    stroke-width="42"
    stroke-linejoin="round"
    stroke-linecap="round"
  />
</svg>
