<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP. blob:/data: разрешены для расшифрованных blob'ов (аватары, attachments).
      'unsafe-inline' для style/script нужен Vite HMR в dev и Radix/Tailwind inline styles.
      connect-src 'self' ws: для Vite HMR + IPC доступ к main.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self' blob: data:;
        script-src 'self' 'unsafe-inline';
        style-src 'self' 'unsafe-inline';
        img-src 'self' blob: data: https:;
        media-src 'self' blob:;
        connect-src 'self' ws: http: https:;
      "
    />
    <title>Pyn</title>
  </head>
  <body class="h-screen w-screen overflow-hidden bg-bg-surface">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
