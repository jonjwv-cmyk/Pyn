<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP. blob:/data: разрешены для расшифрованных blob'ов (аватары, attachments).
      worker-src нужен MapLibre: он рендерит карту через WebWorker.
      'unsafe-inline' для style/script нужен Vite HMR в dev и Radix/Tailwind inline styles.
      connect-src 'self' ws: для Vite HMR + IPC доступ к main.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self' blob: data:;
        script-src 'self' 'unsafe-inline' https://www.youtube.com https://www.youtube-nocookie.com https://s.ytimg.com https://www.gstatic.com;
        style-src 'self' 'unsafe-inline' https://www.youtube.com https://www.gstatic.com;
        img-src 'self' blob: data: https: pyn-tile:;
        media-src 'self' blob: https: mediastream:;
        frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://youtube.com https://*.youtube.com https://*.youtube-nocookie.com;
        child-src 'self' blob: https://www.youtube.com https://www.youtube-nocookie.com https://*.youtube.com;
        worker-src 'self' blob:;
        connect-src 'self' ws: wss: http: https: blob: data: pyn-tile:;
      "
    />
    <title>Pyn</title>
  </head>
  <body class="h-screen w-screen overflow-hidden bg-bg-surface">
    <div id="root"></div>
    <!--
      Portal-узел для оверлей-редактора ячеек glide-data-grid (раздел «Поток»).
      Требование Glide v6: редактор ячейки/выпадашка монтируются в `#portal`
      последним в body. Пустой узел 0×0 — невидим и ничего не блокирует, пока
      не идёт правка ячейки. Канонический setup, не трогает остальной UI.
    -->
    <div id="portal" style="position: fixed; left: 0; top: 0; z-index: 9999;"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
