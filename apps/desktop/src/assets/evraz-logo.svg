<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60" fill="none">
  <!--
    Логотип «ЕВРАЗ» — точный официальный паттерн:
    три горизонтальные полоски слева (жёлтый / оранжевый / красно-оранжевый)
    + жирный sans-serif текст справа.
    Источник цветов — корпоративный brand reference.
  -->
  <!-- Три полоски, равной длины, sharp corners, тонкий gap между ними -->
  <rect x="0"  y="11" width="60" height="9" fill="#F4B028"/>
  <rect x="0"  y="25" width="60" height="9" fill="#F08020"/>
  <rect x="0"  y="39" width="60" height="9" fill="#E15428"/>

  <!-- Текст «ЕВРАЗ» — bold sans-serif, кириллица, чёрный -->
  <text
    x="78"
    y="46"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI Variable Display', 'Segoe UI', 'SF Pro Display', Inter, system-ui, sans-serif"
    font-size="44"
    font-weight="900"
    fill="#1A1A1A"
    letter-spacing="-0.5"
  >ЕВРАЗ</text>
</svg>
