<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!--
    Colorway D — two-tone. Stem = kraft (paper), bow = clay (accent).
    Subtle hierarchy: два warm-earth тона palette приложения вместе.
  -->
  <rect width="256" height="256" rx="48" fill="#161611"/>
  <!-- Stem: kraft (lighter) -->
  <rect x="56"  y="56"  width="38"  height="144" rx="6" fill="#D4A37F"/>
  <!-- Top bow: bookcloth (warm terracotta) -->
  <rect x="104" y="56"  width="96"  height="40"  rx="6" fill="#CC785C"/>
  <!-- Mid bow: clay-dim (deeper) -->
  <rect x="104" y="108" width="72"  height="38"  rx="6" fill="#B35E45"/>
</svg>
