<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!--
    Pyn Logo — CANONICAL.
    D/v2 form + T2 tonal variation (±6% L on clay-dim base).
    Base: HSL(14° 44% 49%) = #B35E45 (accent-clay-dim).
    Background: #161611 (bg-deep, app underlay).

    Tonal rationale: «свет сверху» — top-bow brightest (highlight),
    stem mid (base hue), mid-bow darkest (shadow under top-bow).
    Subtle 6% step preserves monochrome story while adding depth.
  -->
  <rect width="256" height="256" rx="48" fill="#161611"/>

  <!-- Stem — base #B35E45 (canon clay-dim) -->
  <rect x="56" y="56" width="38" height="144" rx="6" fill="#B35E45"/>

  <!-- Top-bow — highlight, +6% L → #C56C50 -->
  <rect x="104" y="56" width="96" height="40" rx="6" fill="#C56C50"/>

  <!-- Mid-bow — shadow, -6% L → #9D533D -->
  <rect x="104" y="108" width="72" height="38" rx="6" fill="#9D533D"/>
</svg>
