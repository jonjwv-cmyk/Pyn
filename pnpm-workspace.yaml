packages:
  - 'apps/*'
  - 'packages/*'

# Разрешаем build scripts для нативных зависимостей.
# electron — скачивает native binary при post-install.
# esbuild — скачивает native binary для bundling.
# uiohook-napi — global input (Accessibility) for pet/desktop.
allowBuilds:
  electron: true
  esbuild: true
  uiohook-napi: true
